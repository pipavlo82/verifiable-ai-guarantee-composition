name: Checker independence and C binding v4.1
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  v4_1-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - run: python -B tools/verify_artifacts.py
      - run: python -B tools/v3/prepare.py --online
      - run: python -B tools/v4_1/run.py
      - run: python -B -m unittest -v tests.v4_1.test_v4_1
      - run: python -B -O -m unittest -v tests.v4_1.test_v4_1
      - run: python -B tools/v4_1/mutations.py --out build/v4_1/mutations
      - run: python -B -O tools/v4_1/mutations.py --out build/v4_1/mutations-optimized
      - run: python -B tools/verify_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v4_1-admission
          path: |
            build/v4_1
            build/v3/setup-replay
            build/v2/native
