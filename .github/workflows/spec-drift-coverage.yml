name: Specification drift and obligation evidence
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  offline-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B tools/agent_harness.py prepare
      - run: python -B tools/spec_drift_coverage/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spec-drift-offline-evidence
          path: build/spec-drift-coverage/validation
  upstream-monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B tools/spec_drift_coverage/drift.py --live --out build/spec-drift-live
      - name: Report source review warnings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/spec-drift-live/SOURCE_DRIFT.json')
          if p.exists():
              for r in json.loads(p.read_bytes())['results']:
                  if r['review_required']:
                      print('::warning::' + r['source_id'] + ': ' + r['comparison'] + '; source review required, not an implementation verdict')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spec-drift-live-evidence
          path: build/spec-drift-live
